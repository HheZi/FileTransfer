name: Build and publish release

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build (Linux)
    runs-on: ubuntu-24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc-14 \
            g++-14 \
            ninja-build \
            libboost-all-dev \
            libprotobuf-dev \
            protobuf-compiler \
            libwxgtk3.2-dev

      - name: Set up CMake
        uses: lukka/get-cmake@v4.2.1

      - name: Build Linux application
        run: |
          gcc-14 --version
          cmake --version
          CC=gcc-14 CXX=g++-14 cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel

          mkdir -p dist
          cp build/src/app/app dist/FileTransfer-linux

          cat > dist/run-linux.sh <<'EOF'
          #!/usr/bin/env sh
          set -eu
          SCRIPT_DIR="$(CDPATH= cd -- "$(dirname -- "$0")" && pwd)"
          exec "$SCRIPT_DIR/FileTransfer-linux" "$@"
          EOF

          chmod +x dist/run-linux.sh

      - name: Upload Linux build outputs
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download Linux build outputs
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist

      - name: Create release and attach Linux builds
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/* \
            --generate-notes \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY"